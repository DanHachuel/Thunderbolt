[theme]
font = "sans serif"

[theme.dark]
primaryColor = "#35A7FF"
backgroundColor = "#0B1118"
secondaryBackgroundColor = "#121B26"
textColor = "#F4F8FB"

[theme.dark.sidebar]
backgroundColor = "#0B1118"
secondaryBackgroundColor = "#121B26"

[theme.light]
primaryColor = "#1677C8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#17212B"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"

[client]
toolbarMode = "auto"
# 1.1.00 - a app tem navegação PRÓPRIA (st.sidebar com o menu em árvore). A
# pasta app/pages/ faz o Streamlit injectar um selector automático de páginas
# ("main" / "canva skills") ACIMA do logo — poluição visual no topo da sidebar.
# Desliga essa navegação automática; a página Canva Skills deixa de aparecer
# nesse selector (continua no repo, app/pages/canva_skills.py).
showSidebarNavigation = false

[server]
enableStaticServing = true

[logger]
hideWelcomeMessage = true
# 1.1.14 — o crash das 48 h veio acompanhado de um terminal inundado de linhas
# iguais (chave duplicada, fragmento evicto). Nível `error` mantém o que é
# verdadeiramente um erro e deita fora o ruído de depuração, que numa sessão
# longa acumula no buffer do console e na memória do processo. O launcher
# injecta o mesmo valor por ambiente (STREAMLIT_LOGGER_LEVEL), o que vale também
# para a cópia em `storage/`.
level = "error"
