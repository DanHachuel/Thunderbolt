name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar; deixe vazio para usar a versão do package.json"
        required: false
        type: string
      dist_tag:
        description: "NPM dist-tag para execuções manuais"
        required: false
        default: next
        type: choice
        options:
          - next
          - latest
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Apply requested version
        if: ${{ inputs.version != '' }}
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          node -e 'const v = process.env.REQUESTED_VERSION; if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.[0-9]{2}$/.test(v || "")) { console.error("Invalid version; expected MAJOR.MINOR.PATCH with a two-digit PATCH"); process.exit(1); }'
          if [ "$CURRENT_VERSION" != "$REQUESTED_VERSION" ]; then
            npm version "$REQUESTED_VERSION" --no-git-tag-version
          else
            echo "Version $CURRENT_VERSION already selected; no change needed."
          fi

      - name: Validate package metadata
        run: |
          node --check scripts/cli.mjs
          node -e "const p=require('./package.json'); if (!p.name.startsWith('@danhachuel/')) process.exit(1); if (!p.bin || !p.bin['thunderbolt']) process.exit(1); console.log(p.name + '@' + p.version)"
          npm pack --dry-run

      - name: Smoke test launcher install
        run: |
          TEST_ROOT="${RUNNER_TEMP}/thunderbolt-install-smoke"
          THUNDERBOLT_HOME="$TEST_ROOT" node scripts/cli.mjs install --skip-python-deps --skip-moneyprinter
          test -d "$TEST_ROOT/storage/blueprints/importados"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REQUESTED_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          PACKAGE="@danhachuel/thunderbolt"
          VERSION=$(node -p "require('./package.json').version")
          DIST_TAG="${REQUESTED_DIST_TAG:-latest}"
          case "$DIST_TAG" in
            next|latest) ;;
            *) echo "Unsupported npm dist-tag: $DIST_TAG" >&2; exit 1 ;;
          esac
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} already exists; assigning dist-tag ${DIST_TAG}."
            npm dist-tag add "${PACKAGE}@${VERSION}" "$DIST_TAG"
          else
            npm publish --access public --tag "$DIST_TAG"
          fi

      - name: Verify published tarball is downloadable
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL=""
          for attempt in $(seq 1 72); do
            TARBALL=$(npm view "@danhachuel/thunderbolt@${VERSION}" dist.tarball 2>/dev/null || true)
            if [ -n "$TARBALL" ]; then
              break
            fi
            echo "Published metadata not available yet (attempt ${attempt}/72); waiting 5 seconds..."
            sleep 5
          done
          if [ -z "$TARBALL" ]; then
            echo "Published metadata was not available for @danhachuel/thunderbolt@${VERSION}"
            exit 1
          fi
          for attempt in $(seq 1 72); do
            if curl --fail --location --silent --show-error --output /dev/null "$TARBALL"; then
              echo "Published tarball is available: $TARBALL"
              exit 0
            fi
            echo "Tarball not available yet (attempt ${attempt}/72); waiting 5 seconds..."
            sleep 5
          done
          echo "Published tarball was not downloadable: $TARBALL"
          exit 1
